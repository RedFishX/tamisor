name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  # Construit les deux images (sans les publier) : une mise à jour de Node, de nginx ou de TypeScript qui casse
  # l'image est vue sur la PR, pas au moment d'un tag de version.
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --target web -t tamisor-web .
      - run: docker build --target cli -t tamisor-cli .
      - name: Image web (nginx, /healthz et en-têtes)
        run: |
          docker run -d --name web -p 8080:8080 tamisor-web
          for i in $(seq 1 15); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 2; done
          curl -fsSI http://127.0.0.1:8080/ | grep -i "^content-security-policy"
      - name: Image CLI (analyse d'une configuration d'exemple)
        run: docker run --rm -v "$PWD/test:/work:ro" tamisor-cli siege-pme.conf --fail-on none
