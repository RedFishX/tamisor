name: Images Docker

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Uniquement dans le dépôt public (ce fichier existe aussi dans le dépôt privé, d'où il est publié).
    if: github.repository == 'RedFishX/tamisor'
    strategy:
      matrix:
        include:
          - target: web
            image: tamisor
            description: "Tamisor, application web d'audit des politiques de pare-feu FortiGate (analyse dans le navigateur)."
          - target: cli
            image: tamisor-cli
            description: "Commande tamisor pour la CI : audit d'une configuration FortiGate, rapports SARIF et JSON."
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        env:
          # GitHub lit la description d'une image multi-architecture sur l'index du manifeste.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.description=${{ matrix.description }}
          annotations: |
            org.opencontainers.image.description=${{ matrix.description }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
