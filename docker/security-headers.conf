# Inclus dans chaque location : nginx n'hérite pas des add_header d'un niveau supérieur dès qu'un location en déclare.
# 'unsafe-inline' pour les styles uniquement (largeurs des barres de progression en attribut style).
# connect-src 'self' : l'application ne fait aucune requête vers l'extérieur.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; worker-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
