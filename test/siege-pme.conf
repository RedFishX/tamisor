#config-version=FGT60F-7.4.4-FW-build2662-240514:opmode=0:vdom=0:user=admin
config system global
    set hostname "FGT-SIEGE-LYON"
    set timezone "Europe/Paris"
end
config system zone
    edit "ZONE-INTERNE"
        set interface "lan" "voip"
    next
end
config firewall address
    edit "LAN-Postes"
        set subnet 10.10.0.0 255.255.255.0
    next
    edit "LAN-Postes-copie"
        set subnet 10.10.0.0 255.255.255.0
    next
    edit "LAN-Serveurs"
        set subnet 10.10.10.0 255.255.255.0
    next
    edit "SRV-AD-01"
        set subnet 10.10.10.5 255.255.255.255
    next
    edit "SRV-FICHIERS-01"
        set subnet 10.10.10.20 255.255.255.255
    next
    edit "DMZ-Web"
        set subnet 10.20.0.0 255.255.255.0
    next
    edit "SRV-WEB-01"
        set subnet 10.20.0.10 255.255.255.255
    next
    edit "Admins-IT"
        set subnet 10.10.99.0 255.255.255.240
    next
    edit "Wifi-Invites"
        set subnet 192.168.50.0 255.255.255.0
    next
    edit "PRESTA-MAINTENANCE"
        set subnet 198.51.100.40 255.255.255.255
    next
    edit "OLD-IMPRIMANTE-RDC"
        set subnet 10.10.0.250 255.255.255.255
    next
    edit "A-COMPLETER"
    next
    edit "FQDN-UPDATE-EDITEUR"
        set type fqdn
        set fqdn "updates.editeur-metier.example"
    next
end
config firewall addrgrp
    edit "GRP-SERVEURS-AD"
        set member "SRV-AD-01" "SRV-FICHIERS-01"
    next
    edit "GRP-ANCIENS-POSTES"
        set member "OLD-IMPRIMANTE-RDC"
    next
end
config firewall service custom
    edit "APP-METIER-8443"
        set tcp-portrange 8443
    next
    edit "APP-METIER-8443-BIS"
        set tcp-portrange 8443
    next
    edit "SVC-INCOMPLET"
    next
end
config firewall service group
    edit "GRP-ADMIN-SERVICES"
        set member "SSH" "RDP"
    next
end
config firewall vip
    edit "VIP-WEB-HTTPS"
        set extip 203.0.113.10
        set extintf "wan1"
        set portforward enable
        set mappedip "10.20.0.10"
        set protocol tcp
        set extport 443
        set mappedport 443
    next
end
config firewall profile-group
    edit "PG-STANDARD"
        set av-profile "default"
        set ips-sensor "default"
        set webfilter-profile "default"
        set ssl-ssh-profile "certificate-inspection"
    next
end
config firewall policy
    edit 1
        set name "Admins-vers-serveurs"
        set srcintf "lan"
        set dstintf "lan"
        set srcaddr "Admins-IT"
        set dstaddr "GRP-SERVEURS-AD"
        set action accept
        set schedule "always"
        set service "GRP-ADMIN-SERVICES"
        set utm-status enable
        set profile-type group
        set profile-group "PG-STANDARD"
        set logtraffic all
        set comments "Administration des serveurs. Ticket CHG-20418, owner: infra-lyon"
    next
    edit 2
        set name "Postes-Internet"
        set srcintf "lan"
        set dstintf "wan1"
        set srcaddr "LAN-Postes"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HTTP" "HTTPS" "DNS"
        set utm-status enable
        set ssl-ssh-profile "certificate-inspection"
        set av-profile "default"
        set ips-sensor "default"
        set webfilter-profile "default"
        set logtraffic all
        set nat enable
        set comments "Navigation des postes. Ticket CHG-19877, owner: infra-lyon"
    next
    edit 3
        set name "Acces-global-temporaire"
        set srcintf "lan"
        set dstintf "wan1"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set logtraffic disable
        set nat enable
        set comments "Regle temporaire pour la migration ERP, a supprimer"
    next
    edit 4
        set name "Postes-HTTPS-doublon"
        set srcintf "lan"
        set dstintf "wan1"
        set srcaddr "LAN-Postes"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HTTPS"
        set utm-status enable
        set av-profile "default"
        set logtraffic all
        set comments "Ajoutee en 2022. Ticket CHG-15002, owner: infra-lyon"
    next
    edit 5
        set name "Publication-Web"
        set srcintf "wan1"
        set dstintf "dmz"
        set srcaddr "all"
        set dstaddr "VIP-WEB-HTTPS"
        set action accept
        set schedule "always"
        set service "HTTPS"
        set utm-status enable
        set logtraffic all
        set comments "Site vitrine. Ticket CHG-20011, owner: web-team"
    next
    edit 6
        set name "Presta-maintenance-AD"
        set srcintf "wan1"
        set dstintf "lan"
        set srcaddr "PRESTA-MAINTENANCE"
        set dstaddr "SRV-AD-01"
        set action accept
        set schedule "always"
        set service "RDP"
        set ips-sensor "default"
        set logtraffic all
        set comments "Acces prestataire. Ticket CHG-20233, owner: infra-lyon"
    next
    edit 7
        set name "Invites-Internet"
        set srcintf "wifi-invites"
        set dstintf "any"
        set srcaddr "Wifi-Invites"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HTTPS" "DNS"
        set utm-status enable
        set av-profile "default"
        set ips-sensor "default"
        set webfilter-profile "default"
        set logtraffic all
        set nat enable
        set comments "Wifi invites. Ticket CHG-18740, owner: infra-lyon"
    next
    edit 8
        set name "Ancienne-regle-imprimante"
        set status disable
        set srcintf "lan"
        set dstintf "wan1"
        set srcaddr "OLD-IMPRIMANTE-RDC"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set logtraffic disable
    next
    edit 9
        set srcintf "lan"
        set dstintf "dmz"
        set srcaddr "LAN-Postes"
        set dstaddr "DMZ-Web"
        set action accept
        set schedule "always"
        set service "APP-METIER-8443" "APP-METIER-8443-BIS"
        set logtraffic all
    next
    edit 10
        set name "Postes-editeur-sans-inspection"
        set srcintf "lan"
        set dstintf "wan1"
        set srcaddr "LAN-Postes-copie"
        set dstaddr "FQDN-UPDATE-EDITEUR"
        set action accept
        set schedule "always"
        set service "HTTPS"
        set utm-status enable
        set ips-sensor "default"
        set ssl-ssh-profile "no-inspection"
        set logtraffic all
        set comments "Mises a jour logiciel metier. Ticket CHG-19120, owner: infra-lyon"
    next
    edit 11
        set name "Refus-par-defaut"
        set srcintf "any"
        set dstintf "any"
        set srcaddr "all"
        set dstaddr "all"
        set action deny
        set schedule "always"
        set service "ALL"
        set logtraffic all
        set comments "Deny explicite. Ticket CHG-10001, owner: infra-lyon"
    next
end
