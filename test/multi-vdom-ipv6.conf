#config-version=FGT100F-7.2.8-FW-build1639-240215:opmode=0:vdom=1:user=admin
config global
    config system global
        set hostname "FGT-CAMPUS-NANCY"
        set vdom-mode multi-vdom
    end
end
config vdom
    edit "root"
        config firewall address
            edit "CAMPUS-ETUDIANTS"
                set subnet 172.16.0.0 255.255.240.0
            next
            edit "CAMPUS-ETUDIANTS-WIFI"
                set subnet 172.16.4.0 255.255.252.0
            next
            edit "CAMPUS-PERSONNEL"
                set subnet 172.17.0.0 255.255.255.0
            next
            edit "SRV-ENT"
                set subnet 172.17.10.15 255.255.255.255
            next
            edit "SRV-ENT-2"
                set subnet 172.17.10.15 255.255.255.255
            next
        end
        config firewall address6
            edit "CAMPUS-V6"
                set ip6 2001:db8:100::/48
            next
            edit "SRV-ENT-V6"
                set ip6 2001:db8:100:10::15/128
            next
            edit "V6-ORPHELIN"
                set ip6 2001:db8:100:99::/64
            next
        end
        config firewall addrgrp
            edit "GRP-CAMPUS"
                set member "CAMPUS-ETUDIANTS" "CAMPUS-PERSONNEL"
            next
        end
        config firewall policy
            edit 1
                set name "Etudiants-Internet"
                set srcintf "port2"
                set dstintf "port1"
                set srcaddr "CAMPUS-ETUDIANTS"
                set dstaddr "all"
                set action accept
                set schedule "always"
                set service "HTTP" "HTTPS" "DNS"
                set utm-status enable
                set av-profile "default"
                set ips-sensor "default"
                set webfilter-profile "default"
                set logtraffic all
                set nat enable
                set comments "Acces Internet etudiants. Ticket SD-3321, owner: dsi-reseau"
            next
            edit 2
                set name "Wifi-etudiants-Internet"
                set srcintf "port2"
                set dstintf "port1"
                set srcaddr "CAMPUS-ETUDIANTS-WIFI"
                set dstaddr "all"
                set action accept
                set schedule "always"
                set service "HTTPS"
                set utm-status enable
                set av-profile "default"
                set ips-sensor "default"
                set logtraffic all
                set nat enable
                set comments "Sous-ensemble du precedent. Ticket SD-3322, owner: dsi-reseau"
            next
            edit 3
                set name "Personnel-ENT"
                set srcintf "port3"
                set dstintf "port4"
                set srcaddr "CAMPUS-PERSONNEL"
                set dstaddr "SRV-ENT"
                set action accept
                set schedule "always"
                set service "HTTPS" "SSH"
                set utm-status enable
                set ips-sensor "default"
                set logtraffic all
                set comments "Acces ENT. Ticket SD-3010, owner: dsi-applis"
            next
            edit 4
                set name "Personnel-ENT-bis"
                set srcintf "port3"
                set dstintf "port4"
                set srcaddr "CAMPUS-PERSONNEL"
                set dstaddr "SRV-ENT"
                set action accept
                set schedule "always"
                set service "HTTPS" "SSH"
                set utm-status enable
                set ips-sensor "default"
                set logtraffic all
                set comments "Doublon exact de la regle 3. Ticket SD-3011, owner: dsi-applis"
            next
            edit 5
                set name "Tout-sortant-direction"
                set srcintf "any"
                set dstintf "port1"
                set srcaddr "all"
                set dstaddr "all"
                set action accept
                set schedule "always"
                set service "ALL_TCP"
                set logtraffic disable
                set nat enable
                set comments "Direction - a revoir. Ticket SD-2500, owner: dsi-reseau"
            next
        end
        config firewall policy6
            edit 1
                set name "V6-Campus-Internet"
                set srcintf "port2"
                set dstintf "port1"
                set srcaddr "CAMPUS-V6"
                set dstaddr "all"
                set action accept
                set schedule "always"
                set service "HTTP" "HTTPS" "DNS"
                set utm-status enable
                set av-profile "default"
                set ips-sensor "default"
                set logtraffic all
                set comments "IPv6 sortant. Ticket SD-3400, owner: dsi-reseau"
            next
            edit 2
                set name "V6-Campus-HTTPS"
                set srcintf "port2"
                set dstintf "port1"
                set srcaddr "CAMPUS-V6"
                set dstaddr "all"
                set action accept
                set schedule "always"
                set service "HTTPS"
                set utm-status enable
                set av-profile "default"
                set logtraffic all
                set comments "Masquee par la regle IPv6 n°1. Ticket SD-3401, owner: dsi-reseau"
            next
            edit 3
                set name "V6-ENT-ouvert"
                set srcintf "port1"
                set dstintf "port4"
                set srcaddr "all"
                set dstaddr "SRV-ENT-V6"
                set action accept
                set schedule "always"
                set service "ALL"
                set logtraffic disable
                set comments "Ouvert pour tests. Ticket SD-3405, owner: dsi-applis"
            next
        end
    next
    edit "RECHERCHE"
        config firewall address
            edit "LABO-GENOMIQUE"
                set subnet 10.88.0.0 255.255.0.0
            next
            edit "CALCUL-HPC"
                set subnet 10.88.20.0 255.255.255.0
            next
            edit "PARTENAIRE-INSTITUT"
                set subnet 203.0.113.64 255.255.255.192
            next
        end
        config firewall service custom
            edit "TRANSFERT-DONNEES"
                set tcp-portrange 2811 50000-51000
            next
        end
        config firewall policy
            edit 1
                set name "Labo-vers-HPC"
                set srcintf "port5"
                set dstintf "port6"
                set srcaddr "LABO-GENOMIQUE"
                set dstaddr "CALCUL-HPC"
                set action accept
                set schedule "always"
                set service "SSH" "TRANSFERT-DONNEES"
                set utm-status enable
                set ips-sensor "default"
                set logtraffic all
                set comments "Soumission de jobs. Ticket SD-2901, owner: pole-recherche"
            next
            edit 2
                set name "Partenaire-vers-HPC"
                set srcintf "port7"
                set dstintf "port6"
                set srcaddr "PARTENAIRE-INSTITUT"
                set dstaddr "CALCUL-HPC"
                set action accept
                set schedule "always"
                set service "TRANSFERT-DONNEES"
                set logtraffic utm
                set comments "Collaboration institut partenaire. Ticket SD-2950, owner: pole-recherche"
            next
            edit 3
                set name "Labo-vers-HPC"
                set srcintf "port5"
                set dstintf "port6"
                set srcaddr "all"
                set dstaddr "all"
                set action accept
                set schedule "always"
                set service "ALL"
                set logtraffic all
                set comments "Meme nom, autre VDOM : ne doit pas etre compare a la regle du VDOM root"
            next
        end
    next
end
