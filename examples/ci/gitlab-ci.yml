# Audit Tamisor à chaque merge request (GitLab CI).
#
# Prérequis dans le dépôt des configurations :
#   - tools/tamisor.mjs : la commande construite par `npm run build:cli` dans le dépôt Tamisor
#     (un seul fichier, sans dépendance ; Node 20 ou plus suffit) ;
#   - optionnel : acquittements-tamisor.json, exporté depuis l'application (menu Exporter).
#
# La référence est recalculée à partir de la branche cible : seuls les constats introduits
# par la merge request font échouer le job.

variables:
  TAMISOR_CONFIG: "firewalls/fw-siege.conf"
  TAMISOR_FAIL_ON: "high"   # critical | high | medium | low | none

tamisor:
  stage: test
  image: node:22-alpine
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - firewalls/**/*
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      variables:
        TAMISOR_FAIL_ON: "none"   # branche principale : rapports seulement, sans bloquer
  before_script:
    - apk add --no-cache git
  script:
    - |
      BASELINE_ARGS=""
      if [ -n "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" ]; then
        git fetch --depth=1 origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
        if git show "FETCH_HEAD:$TAMISOR_CONFIG" > /tmp/target.conf 2>/dev/null; then
          node tools/tamisor.mjs /tmp/target.conf --source-uri "$TAMISOR_CONFIG" --json baseline.json --fail-on none > /dev/null
          BASELINE_ARGS="--baseline baseline.json"
        fi
      fi
      ACK_ARGS=""
      [ -f acquittements-tamisor.json ] && ACK_ARGS="--acknowledgements acquittements-tamisor.json"
      node tools/tamisor.mjs "$TAMISOR_CONFIG" \
        --sarif tamisor.sarif --json tamisor.json \
        --fail-on "$TAMISOR_FAIL_ON" $BASELINE_ARGS $ACK_ARGS
  artifacts:
    when: always
    expose_as: "Audit Tamisor"
    paths:
      - tamisor.json
      - tamisor.sarif
    expire_in: 30 days
