# Audit Shadowline à chaque merge request (GitLab CI).
#
# Prérequis dans le dépôt des configurations :
#   - tools/shadowline.mjs : la commande construite par `npm run build:cli` dans le dépôt Shadowline
#     (un seul fichier, sans dépendance ; Node 20 ou plus suffit) ;
#   - optionnel : acquittements-shadowline.json, exporté depuis l'application (menu Exporter).
#
# La référence est recalculée à partir de la branche cible : seuls les constats introduits
# par la merge request font échouer le job.

variables:
  SHADOWLINE_CONFIG: "firewalls/fw-siege.conf"
  SHADOWLINE_FAIL_ON: "high"   # critical | high | medium | low | none

shadowline:
  stage: test
  image: node:22-alpine
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - firewalls/**/*
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      variables:
        SHADOWLINE_FAIL_ON: "none"   # branche principale : rapports seulement, sans bloquer
  before_script:
    - apk add --no-cache git
  script:
    - |
      BASELINE_ARGS=""
      if [ -n "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" ]; then
        git fetch --depth=1 origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
        if git show "FETCH_HEAD:$SHADOWLINE_CONFIG" > /tmp/target.conf 2>/dev/null; then
          node tools/shadowline.mjs /tmp/target.conf --source-uri "$SHADOWLINE_CONFIG" --json baseline.json --fail-on none > /dev/null
          BASELINE_ARGS="--baseline baseline.json"
        fi
      fi
      ACK_ARGS=""
      [ -f acquittements-shadowline.json ] && ACK_ARGS="--acknowledgements acquittements-shadowline.json"
      node tools/shadowline.mjs "$SHADOWLINE_CONFIG" \
        --sarif shadowline.sarif --json shadowline.json \
        --fail-on "$SHADOWLINE_FAIL_ON" $BASELINE_ARGS $ACK_ARGS
  artifacts:
    when: always
    expose_as: "Audit Shadowline"
    paths:
      - shadowline.json
      - shadowline.sarif
    expire_in: 30 days
