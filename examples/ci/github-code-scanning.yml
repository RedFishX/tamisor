# Audit Tamisor à chaque pull request, avec affichage des constats dans GitHub code scanning.
# À placer dans .github/workflows/ du dépôt des configurations, avec tools/tamisor.mjs
# (construit par `npm run build:cli` dans le dépôt Tamisor).

name: Tamisor

on:
  pull_request:
    paths: ["firewalls/**"]
  push:
    branches: [main]
    paths: ["firewalls/**"]

permissions:
  contents: read
  security-events: write   # envoi du SARIF vers code scanning

env:
  TAMISOR_CONFIG: firewalls/fw-siege.conf
  TAMISOR_FAIL_ON: high

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Référence (branche cible)
        if: github.event_name == 'pull_request'
        run: |
          if git show "origin/${{ github.base_ref }}:$TAMISOR_CONFIG" > /tmp/target.conf 2>/dev/null; then
            node tools/tamisor.mjs /tmp/target.conf --source-uri "$TAMISOR_CONFIG" --json baseline.json --fail-on none > /dev/null
          fi
      - name: Audit
        run: |
          ARGS=""
          [ -f baseline.json ] && ARGS="$ARGS --baseline baseline.json"
          [ -f acquittements-tamisor.json ] && ARGS="$ARGS --acknowledgements acquittements-tamisor.json"
          node tools/tamisor.mjs "$TAMISOR_CONFIG" --sarif tamisor.sarif --json tamisor.json \
            --fail-on "${{ github.event_name == 'pull_request' && env.TAMISOR_FAIL_ON || 'none' }}" $ARGS
      - name: Envoi vers code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: tamisor.sarif
          category: tamisor
