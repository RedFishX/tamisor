# Audit Shadowline à chaque pull request, avec affichage des constats dans GitHub code scanning.
# À placer dans .github/workflows/ du dépôt des configurations, avec tools/shadowline.mjs
# (construit par `npm run build:cli` dans le dépôt Shadowline).

name: Shadowline

on:
  pull_request:
    paths: ["firewalls/**"]
  push:
    branches: [main]
    paths: ["firewalls/**"]

permissions:
  contents: read
  security-events: write   # envoi du SARIF vers code scanning

env:
  SHADOWLINE_CONFIG: firewalls/fw-siege.conf
  SHADOWLINE_FAIL_ON: high

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Référence (branche cible)
        if: github.event_name == 'pull_request'
        run: |
          if git show "origin/${{ github.base_ref }}:$SHADOWLINE_CONFIG" > /tmp/target.conf 2>/dev/null; then
            node tools/shadowline.mjs /tmp/target.conf --source-uri "$SHADOWLINE_CONFIG" --json baseline.json --fail-on none > /dev/null
          fi
      - name: Audit
        run: |
          ARGS=""
          [ -f baseline.json ] && ARGS="$ARGS --baseline baseline.json"
          [ -f acquittements-shadowline.json ] && ARGS="$ARGS --acknowledgements acquittements-shadowline.json"
          node tools/shadowline.mjs "$SHADOWLINE_CONFIG" --sarif shadowline.sarif --json shadowline.json \
            --fail-on "${{ github.event_name == 'pull_request' && env.SHADOWLINE_FAIL_ON || 'none' }}" $ARGS
      - name: Envoi vers code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: shadowline.sarif
          category: shadowline
